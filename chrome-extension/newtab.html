<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Salah Companion \u2014 New Tab</title>
<link rel="stylesheet" href="newtab.css" />
</head>
<body>
  <main class="wrap">
    <div class="clock" id="clock">--:--</div>
    <div class="location" id="location">Finding your location\u2026</div>

    <section class="next-card">
      <p class="label">Next Prayer</p>
      <h1 id="next-name">\u2014</h1>
      <p class="starts">Starts <span id="next-time" class="num">--:--</span></p>
      <p id="countdown" class="countdown num">--:--:--</p>
    </section>

    <section class="grid" id="prayer-grid"></section>

    <a class="open-app" href="#" id="open-app">Open Salah Companion \u2192</a>
  </main>
  <script src="newtab.js"></script>
</body>
</html>
